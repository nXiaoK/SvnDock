name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    name: Build, test and package
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Show toolchain
        run: swift --version

      - name: Run unit tests
        shell: bash
        run: |
          set +e
          swift test --disable-sandbox --xunit-output "$RUNNER_TEMP/swift-test.xml" 2>&1 | tee "$RUNNER_TEMP/swift-test.log"
          test_status=${PIPESTATUS[0]}
          set -e
          if (( test_status != 0 )); then
            perl -pe 's/\e\[[0-9;]*[A-Za-z]//g' "$RUNNER_TEMP/swift-test.log" > "$RUNNER_TEMP/swift-test-clean.log"
            diagnostic="$(grep -E '(: error: |Fatal error|XCTAssert|Test Case .* failed|Test Suite .* failed|with [1-9][0-9]* failures?)' "$RUNNER_TEMP/swift-test-clean.log" | tail -n 30 || true)"
            if [[ -z "$diagnostic" ]]; then
              diagnostic="$(grep -E '<failure|<testcase' "$RUNNER_TEMP/swift-test.xml" | tail -n 20 || true)"
            fi
            if [[ -z "$diagnostic" ]]; then
              diagnostic="$(tail -n 20 "$RUNNER_TEMP/swift-test-clean.log")"
            fi
            diagnostic=${diagnostic//'%'/'%25'}
            diagnostic=${diagnostic//$'\r'/'%0D'}
            diagnostic=${diagnostic//$'\n'/'%0A'}
            echo "::error title=Swift test failed::${diagnostic}"
            {
              echo "### Swift test failure"
              echo
              echo '~~~text'
              tail -n 200 "$RUNNER_TEMP/swift-test.log"
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$test_status"
          fi

      - name: Build all products with strict Swift 6 checks
        run: |
          swift build --disable-sandbox -c release \
            -Xswiftc -swift-version -Xswiftc 6 \
            -Xswiftc -strict-concurrency=complete \
            -Xswiftc -warnings-as-errors

      - name: Run core smoke checks
        run: |
          swift run --disable-sandbox -c release \
            -Xswiftc -swift-version -Xswiftc 6 \
            -Xswiftc -strict-concurrency=complete \
            -Xswiftc -warnings-as-errors \
            SvnDockCoreSmoke

      - name: Validate property lists
        run: |
          plutil -lint SvnDockApp/Resources/Info.plist
          plutil -lint FinderExtension/Info.plist
          plutil -lint SvnDockAgent/Info.plist

      - name: Validate local app packaging
        run: ./Scripts/build-local-signed-app.sh "$RUNNER_TEMP/dist"
